const firstPromotedIndex={'I/O modülü':2*pageSize,CPU:pageSize};
const orderedCategories=new Map(Object.entries(firstPromotedIndex).map(([category,index])=>{
  const items=products.filter(product=>product.types.includes(category));
  return [category,[...items.slice(index),...items.slice(0,index)]];
}));
const series=[...new Set(products.map(p=>p.line))];
for(const [select,values] of [[line,series],[type,productTypes]]) {
  for(const value of values.sort((a,b)=>a.localeCompare(b,'tr'))) select.add(new Option(value,value));
}

  const node=document.createElement(tag);
  if(content) node.textContent=content;
  if(className) node.className=className;
  return node;
}
function button(label,handler,className) {
  const node=element('button',label,className);
  node.type='button';
  node.onclick=handler;
  return node;
}

function catalogCablePhoto(product) {
  const kind=/^CTSD[- ](ENL|MOL)-/i.exec(product.name)?.[1]?.toUpperCase();
  return kind ? catalogCablePhotos[kind] : null;
}

function photo(p) {
  const img=element('img');
  img.src=catalogCablePhoto(p) ?? p.image;img.alt=p.name;img.loading='lazy';
  return img;
}
function add(p) {
  list.set(p.id,(list.get(p.id)||0)+1);
  byId('count').textContent=[...list.values()].reduce((a,b)=>a+b,0);
}
function detail(p) {
  const description=element('p',[p.line,...p.types].join(' · '));
  byId('detailBody').replaceChildren(element('h2',p.name),photo(p),description);
  if(p.specifications?.length){
    const table=element('table',null,'product-specifications');
    const body=element('tbody');
    for(const [label,value] of p.specifications){
      const row=element('tr');
      const heading=element('th',label);
      heading.scope='row';
      row.append(heading,element('td',value));
      body.append(row);
    }
    table.append(body);
    byId('detailBody').append(table);
  }else if(p.description){
    byId('detailBody').append(element('p',p.description));
  }
  byId('detailBody').append(button('Teklif listesine ekle',()=>{add(p);byId('detail').close();openQuote();},'primary'));
  byId('detail').showModal();
}
function card(p) {
  const result=element('article',null,'card');
  const image=button('',()=>detail(p),'photo');
  image.setAttribute('aria-label',p.name+' ürün detayını aç');
  image.append(photo(p));
  const body=element('section');
  body.append(element('span',p.line,'tag'),element('h2',p.name),element('small',p.types.join(' · ')));
  result.append(image,body,button('Teklif listesine ekle',e=>{add(p);e.currentTarget.textContent='Listeye eklendi';},'add'));
  return result;
}
const normalized=text=>text.toLowerCase().normalize('NFD').replace(/ı/g,'i').replace(/[^\p{L}\p{N}]/gu,'');
function render() {
  for(const chip of document.querySelectorAll('[data-type]')) {
    chip.setAttribute('aria-pressed',String(type.value===chip.dataset.type));
  }
  const query=normalized(search.value);
  const selected=(orderedCategories.get(type.value)??products).filter(p=>(!line.value||p.line===line.value)&&(!type.value||p.types.includes(type.value))&&[p.name+' '+p.types.join(' '),p.line,...(p.searchTerms??[])].some(term=>normalized(term).includes(query)));
  byId('total').textContent=selected.length+' ürün';
  byId('grid').replaceChildren(...selected.slice((page-1)*pageSize,page*pageSize).map(card));
  if(!selected.length) byId('grid').append(element('p','Aramanıza uygun ürün bulunamadı.'));
  const nav=byId('pages');
  nav.replaceChildren();
  for(let n=1;n<=Math.ceil(selected.length/pageSize);n++){
    const item=button(String(n),()=>{page=n;render();byId('total').scrollIntoView({block:'start'});});
    if(page===n)item.setAttribute('aria-current','page');
    nav.append(item);
  }
}
const publicCatalogUrl='https://www.ykotomasyon.com.tr/cotrust-katalog.html';
function productLink(id, base=location.href) {
  const url=new URL('cotrust-katalog.html',base);
  url.searchParams.set('urun',id);
  return url.href;
}
function openQuote() {
  const field=byId('quoteBody'), ul=element('ul'), rows=[];
  for(const [id,qty] of list) {
    const product=products.find(p=>p.id===id);
    const {name}=product;
    rows.push(qty+' adet · '+name);
    const item=element('li',qty+' adet · ');
    const cablePhoto=catalogCablePhoto(product);
    if(cablePhoto){
      const image=element('img');
      image.src=cablePhoto;
      image.alt=product.types.includes('Enkoder kablosu')?'Enkoder kablosu fotoğrafı':'Motor güç kablosu fotoğrafı';
      image.className='quote-cable-photo';
      item.prepend(image);
      item.append(element('span',name),' ');
    }else{
      const link=element('a',name);
      link.href=productLink(id);
      link.target='_blank';
      link.rel='noopener';
      item.append(link,' ');
    }
    item.append(button('Çıkar',()=>{if(qty===1)list.delete(id);else list.set(id,qty-1);byId('count').textContent=[...list.values()].reduce((a,b)=>a+b,0);openQuote();}));
    ul.append(item);
  }
  field.replaceChildren(rows.length?ul:element('p','Teklif listeniz boş.'));
  const send=byId('send');
  send.hidden=!rows.length;
  byId('downloadQuote').hidden=!rows.length;
  send.href='mailto:info@ykotomasyon.com.tr?subject='+encodeURIComponent('COTRUST teklif talebi')+'&body='+encodeURIComponent('Merhaba, aşağıdaki ürünler için fiyat ve stok bilgisi rica ediyorum.\n\n'+rows.join('\n'));
  if(!byId('quote').open)byId('quote').showModal();
}
byId('basket').onclick=openQuote;
byId('downloadQuote').onclick=async()=>{
  const control=byId('downloadQuote');
  const status=byId('pdfStatus');
  const rows=[...list].map(([id,quantity])=>{
    const product=products.find(p=>p.id===id);
    const cablePhoto=catalogCablePhoto(product);
    return {product:cablePhoto?{...product,image:cablePhoto}:product,quantity,omitProductLink:Boolean(cablePhoto)};
  });
  if(!rows.length)return;
  control.disabled=true;
  status.textContent='PDF hazırlanıyor…';
  try{
    const pdf=await catalogQuotePdf(rows,document.querySelector('.top img').src,id=>productLink(id,publicCatalogUrl));
    pdf.save('COTRUST_Teklif_Urun_Listesi.pdf');
    status.textContent='PDF indirildi.';
  }catch(error){
    console.error(error);
    status.textContent='PDF hazırlanamadı. Yeniden deneyin.';
  }finally{
    control.disabled=false;
  }
};
const refresh=()=>{page=1;render();};
byId('filters').onsubmit=e=>{e.preventDefault();refresh();};
byId('filters').onreset=()=>setTimeout(refresh,0);
line.onchange=type.onchange=search.oninput=refresh;
for(const chip of document.querySelectorAll('[data-type]')) chip.onclick=()=>{
  line.value='';
  search.value='';
  type.value=chip.dataset.type;
  refresh();
};
const queryParameters=new URLSearchParams(location.search);
const requestedType=queryParameters.get('tip');
if(productTypes.includes(requestedType)) type.value=requestedType;
render();
const requestedProduct=products.find(product=>product.id===queryParameters.get('urun'));
if(requestedProduct) detail(requestedProduct);
</script></body></html>
